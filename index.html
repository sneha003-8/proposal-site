<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💜</title>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#000,#2b004d,#000);
color:white;
text-align:center;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background: radial-gradient(circle, rgba(138,0,255,0.2), transparent 40%);
animation: moveBg 12s infinite alternate;
z-index:-1;
}

@keyframes moveBg{
0%{transform:translate(-20%,-20%)}
100%{transform:translate(20%,20%)}
}

.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:20px;
margin:20px;
border-radius:20px;
box-shadow:0 0 25px purple;
}

#typing{
font-size:20px;
line-height:1.8;
margin-bottom:20px;
}

.slider img{
width:90%;
max-width:420px;
border-radius:20px;
box-shadow:0 0 25px purple;
}

.question{
font-size:30px;
margin-top:30px;
}

button{
padding:15px 25px;
font-size:18px;
margin:15px;
border:none;
border-radius:10px;
cursor:pointer;
}

#yes{
background:linear-gradient(45deg,#a100ff,#ff00c8);
color:white;
}

#no{
background:black;
color:white;
border:2px solid purple;
position:absolute;
}
</style>
</head>

<body>

<!-- BACKGROUND MUSIC -->
<audio id="bgMusic" loop>
<source src="melody.mp3">
</audio>

<div class="card">

<p id="typing"></p>

<div class="slider">
<img id="slide" src="photo1.jpg">
</div>

<div id="voiceSection" style="display:none;">

<h3>Listen to My Message 💜</h3>

<audio id="voice" controls>
<source src="voice.m4a">
</audio>

<h1 class="question">
Will You Be My Forever and Ever? 💜
</h1>

<button id="yes" onclick="location.href='yes.html'">YES 💜</button>
<button id="no">NO</button>

</div>

</div>

<script>

/* START MUSIC ON FIRST CLICK */
let music = document.getElementById("bgMusic");

document.body.addEventListener("click", () => {
music.play();
}, { once:true });

/* typing */
let text = `Mujhe Pata hai Hum logo mai Thora Ann Bann chal raha hai...
Par Mai Aapka sath kabhi nahi chorungi...
I Love You... Happy Birthday Jaan...`;

let i=0;

function type(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(type,35);
}
}
type();

/* slider */
let images=["photo1.jpg","photo2.jpg","photo3.jpg"];
let index=0;
let slide=document.getElementById("slide");

let interval=setInterval(()=>{
index++;
if(index<images.length){
slide.src=images[index];
}else{
clearInterval(interval);
document.querySelector(".slider").style.display="none";
document.getElementById("voiceSection").style.display="block";
document.getElementById("voice").play();
}
},1500);

/* NO button escape */
let noBtn=document.getElementById("no");

document.addEventListener("mousemove",(e)=>{
let rect=noBtn.getBoundingClientRect();
if(Math.abs(e.clientX-rect.left)<100){
noBtn.style.left=Math.random()*window.innerWidth+"px";
noBtn.style.top=Math.random()*window.innerHeight+"px";
}
});

</script>

</body>
</html>
