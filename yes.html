<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Said YES 💜</title>

<style>
body{
margin:0;
background:black;
color:white;
text-align:center;
padding:30px;
}

video{
width:90%;
max-width:500px;
border-radius:20px;
}
</style>
</head>

<body>

<h1>You Said YES 💜</h1>

<audio id="bgMusic" loop>
<source src="melody.mp3">
</audio>

<video id="player" autoplay controls>
<source src="video1.mp4">
</video>

<!-- 🔥 ONLY MESSAGE CHANGED HERE -->
<div id="message" style="display:none;">

<h1>💜 Thank You 💜</h1>

<p style="font-size:20px; line-height:1.8; margin-top:20px;">

Thank You for Choosing Me among all the others girls...<br><br>

Thank You For Holding My Hand...<br><br>

Thank You for Not Giving Up On Me...<br><br>

Thank You For Everything...<br><br>

💖 Happy Birthday Hubby...!!! 💖<br><br>

🎉 Many Many Happy Returns of the Day...!!! 🎉

</p>

</div>

<script>

let music=document.getElementById("bgMusic");
let player=document.getElementById("player");

let videos=["video1.mp4","video2.mp4","video3.mp4"];
let index=0;

document.body.addEventListener("click",()=>{
music.play();
},{once:true});

player.addEventListener("play", ()=> music.pause());

player.onended=()=>{
index++;

if(index<videos.length){
player.src=videos[index];
player.play();
}else{
player.style.display="none";
document.getElementById("message").style.display="block";
music.play();
}
};

</script>

</body>
</html>
